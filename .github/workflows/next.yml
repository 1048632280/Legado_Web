name: Legado Next

on:
  push:
    paths: ["next/**", ".github/workflows/next.yml"]
  pull_request:
    paths: ["next/**", ".github/workflows/next.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, test and lint
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
      - name: Install Linux UI dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgtk-3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.os }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
          - os: macos-13
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next
      - name: Install Linux UI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libgtk-3-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: legado-next-${{ matrix.target }}
          path: next/target/${{ matrix.target }}/release/legado-next${{ runner.os == 'Windows' && '.exe' || '' }}
