[package]
name = "legado-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "A lightweight offline TXT reader core for the Flutter desktop client"
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "5.0"
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
